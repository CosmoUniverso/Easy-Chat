name: Build and Release EChat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtconnectivity'
          cache: true

      - name: Install MsQuic 2.6.1
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/Microsoft.Native.Quic.MsQuic.Schannel/2.6.1"
          Invoke-WebRequest -Uri $url -OutFile msquic.nupkg
          Copy-Item msquic.nupkg msquic.zip
          Expand-Archive -Path msquic.zip -DestinationPath msquic-package -Force
          $header = Get-ChildItem msquic-package -Recurse -Filter msquic.h | Select-Object -First 1
          $lib = Get-ChildItem msquic-package -Recurse -Filter msquic.lib | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $dll = Get-ChildItem msquic-package -Recurse -Filter msquic.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $header -or -not $lib -or -not $dll) { throw "MsQuic NuGet layout not recognized" }
          "MSQUIC_INCLUDE_DIR=$($header.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSQUIC_LIBRARY=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSQUIC_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DECHAT_BUILD_TESTS=ON `
            -DMSQUIC_INCLUDE_DIR="$env:MSQUIC_INCLUDE_DIR" `
            -DMSQUIC_LIBRARY="$env:MSQUIC_LIBRARY"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/EChat | Out-Null
          Copy-Item build/EChat.exe dist/EChat/
          Copy-Item build/echat-cli.exe dist/EChat/
          windeployqt --release --compiler-runtime --no-translations dist/EChat/EChat.exe
          Get-ChildItem -Recurse build/vcpkg_installed/x64-windows/bin -Filter "*sodium*.dll" | ForEach-Object { Copy-Item $_.FullName dist/EChat/ -Force }
          Copy-Item "$env:MSQUIC_DLL" dist/EChat/msquic.dll -Force

      - name: Build one-file Windows installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Push-Location packaging/windows
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" EChat.nsi
          Pop-Location
          Move-Item packaging/windows/EChat-Windows-x64-Setup.exe release-assets/EChat-Windows-x64-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EChat-Windows-x64
          path: release-assets/EChat-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsodium-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2 wget file patchelf openssl
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic=2.6.1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'linux_gcc_64'
          modules: 'qtconnectivity'
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DECHAT_BUILD_TESTS=ON
          cmake --build build
          ./build/EChatCryptoSelfTest
          ./build/EChatReliabilitySelfTest

      - name: Build one-file AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p tools release-assets
          wget -q -O tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/*.AppImage
          export PATH="$PWD/tools:$PATH"
          export QMAKE="$(command -v qmake6 || command -v qmake)"

          # Qt ships optional SQL drivers that may depend on proprietary DB client
          # libraries not present on the runner. EChat only needs SQLite, so remove
          # Mimer's plugin before linuxdeploy scans all Qt SQL drivers.
          find "${QT_ROOT_DIR:-$PWD/Qt}" -type f -name 'libqsqlmimer.so' -print -delete || true

          tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/EChat \
            --executable build/echat-cli \
            --desktop-file packaging/linux/EChat.desktop \
            --icon-file packaging/linux/echat.svg \
            --plugin qt \
            --output appimage
          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" release-assets/EChat-Linux-x86_64.AppImage
          chmod +x release-assets/EChat-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: EChat-Linux-x86_64
          path: release-assets/EChat-Linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [windows, linux]
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*project(EChat VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EChat ${{ steps.version.outputs.version }}
          body: |
            EChat ${{ steps.version.outputs.version }} pre-alpha.

            0.7 dual-UI desktop update:
            - EChat Light keeps the compact/minimal interface and Stealth mode
            - EChat Full adds a richer modern messenger workspace with action rail, filters and details panel
            - Light and Full share the same account, SQLite database, E2EE core, transports, queues and relay state
            - switch modes without creating a second identity or duplicating message history
            - the selected UI mode is remembered across restarts
            - command-line overrides: `--light`, `--full`, `--ui=light`, `--ui=full`
            - Windows Start Menu includes dedicated Light and Full shortcuts; Linux desktop entry exposes Light/Full actions
            - queued-policy rebinding, Stealth mode, delete-for-everyone, group management and username changes are retained

            Ready-to-run downloads:
            - Windows 10/11 x64: `EChat-Windows-x64-Setup.exe`
            - Linux/Fedora x86_64: `EChat-Linux-x86_64.AppImage`

            EChat 0.7 keeps protocol v4 and remains wire-compatible with 0.5/0.6 peers. The two UI modes are local presentation layers only. Crypto v2 is not a Double Ratchet and is not recommended for high-risk communications.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/EChat-Windows-x64-Setup.exe
            release-assets/EChat-Linux-x86_64.AppImage
